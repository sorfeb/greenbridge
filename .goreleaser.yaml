# GoReleaser v2: builds and publishes a GitHub Release when a v* tag is pushed.
# Pull requests run a snapshot build of the same config (.github/workflows/release.yml).
# https://goreleaser.com/customization/
version: 2

project_name: gbridge

# Shell completion scripts ship in every archive. Hooks run without a shell,
# so each redirect goes through sh (release.yml runs on ubuntu).
before:
  hooks:
    - rm -rf completions
    - mkdir completions
    - sh -c "go run ./cmd/gbridge completion bash > completions/gbridge.bash"
    - sh -c "go run ./cmd/gbridge completion zsh > completions/_gbridge"
    - sh -c "go run ./cmd/gbridge completion fish > completions/gbridge.fish"
    - sh -c "go run ./cmd/gbridge completion powershell > completions/gbridge.ps1"

builds:
  - main: ./cmd/gbridge
    binary: gbridge
    env:
      - CGO_ENABLED=0 # static binaries: no libc version to match on the user's machine
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath # no build-machine paths in the binary; part of reproducibility
    ldflags:
      - -s -w # drop the symbol table and DWARF; smaller download, stack traces still work
      - -X main.version={{.Version}}
    mod_timestamp: "{{.CommitTimestamp}}" # same commit, same bytes

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    files: [README.md, LICENSE, completions/*]

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, made by syft: every module compiled into gbridge, with
# versions. Listed in checksums.txt, so the provenance attestation covers them.
sboms:
  - artifacts: archive

# Package channels. Each pushes to a repo of its own, which the default Actions token
# can't reach: release.yml passes PACKAGE_REPOS_TOKEN, a fine-grained token scoped to
# those two repos. Without that secret, skip_upload is true and nothing is pushed, so a
# tag still releases before the repos exist. Snapshot builds never publish.
homebrew_casks:
  - name: gbridge
    repository:
      owner: sorfeb
      name: homebrew-tap
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    skip_upload: '{{ if index .Env "PACKAGE_REPOS_TOKEN" }}auto{{ else }}true{{ end }}' # auto: v0.2.0-rc.1 stays out of the tap
    homepage: https://github.com/sorfeb/greenbridge
    description: Mirror commits GitHub can't see onto your GitHub contribution graph
    binaries: [gbridge]
    completions:
      bash: completions/gbridge.bash
      zsh: completions/_gbridge
      fish: completions/gbridge.fish
    # Release binaries are unsigned (issue #28). Without this, Gatekeeper reports the
    # download as damaged. `install` is the key in v2.18; v2.19 renames it install_steps.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gbridge"]
          end

scoops:
  - name: gbridge
    repository:
      owner: sorfeb
      name: scoop-bucket
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    skip_upload: '{{ if index .Env "PACKAGE_REPOS_TOKEN" }}auto{{ else }}true{{ end }}'
    homepage: https://github.com/sorfeb/greenbridge
    description: Mirror commits GitHub can't see onto your GitHub contribution graph
    license: MIT

snapshot:
  version_template: "{{incpatch .Version}}-next"

changelog:
  use: github # links each entry to its commit and author
  sort: asc
  filters:
    exclude:
      - "^(build|chore|ci|docs|refactor|style|test)(\\(.+\\))?:"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  prerelease: auto # v0.2.0-rc.1 is marked as a prerelease
  footer: |
    ## Install

    Download the archive for your platform below, or with Go 1.27+:

    ```sh
    go install github.com/sorfeb/greenbridge/cmd/gbridge@{{.Tag}}
    ```

    Verify a download was built by this repo's release workflow:

    ```sh
    gh attestation verify gbridge_{{.Version}}_linux_amd64.tar.gz --repo sorfeb/greenbridge
    ```
