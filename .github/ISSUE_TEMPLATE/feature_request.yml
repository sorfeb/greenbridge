name: Feature request
description: Suggest a change to what gbridge does
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you would solve it, if you have a view.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This doesn't change what a mirror commit carries (only timestamps and opaque IDs leave the machine)
